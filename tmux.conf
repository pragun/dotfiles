# Set prefix to Ctrl-b
unbind C-b
set-option -g prefix C-b
bind-key C-b send-prefix

# Close window
bind-key q kill-window

# New OS window (tmux equivalent: new session in a new terminal)
bind-key n new-session

# Splitting windows
bind-key s split-window -h  # Horizontal split
bind-key v split-window -v  # Vertical split

# Navigate between windows
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# Detach and create new tab (detaching in tmux detaches the session)
bind-key t detach-client

# Reload tmux config
bind-key r source-file ~/.tmux.conf

# Create new tab (new window in tmux)
bind-key n new-window

# Kitty's "fat" and "tall" layouts mapped to tmux equivalents
bind-key f select-layout even-horizontal  # Equivalent to "fat"
bind-key l select-layout even-vertical    # Equivalent to "tall"

# Broadcast mode (sends input to all panes in the tab)
bind-key c setw synchronize-panes on; send-keys Escape

# Tab navigation
bind-key t next-window
bind-key p previous-window

# Start resizing mode
bind-key r resize-pane -Z

# Goto specific tab (window)
bind-key 0 select-window -t :0
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5

# Disable unused shortcuts (tmux does not support no_op, so we use unbind)
unbind -n C-S-Left
unbind -n C-S-Right
unbind -n C-S-Up
unbind -n C-S-Down
unbind -n C-S-t

