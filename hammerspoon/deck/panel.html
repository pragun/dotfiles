<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wez Deck</title>
<style>
/* Layout: a bar that always says what the next key does, then one list. Home shows every project; inside a project the list narrows to it. */
:root {
  --bg:#f4f6f6; --panel:#ffffff; --ink:#14201f; --dim:#667876; --line:#d9e1e0; --sel:#dff0f1;
  --accent:#0b6e75; --work:#2d6cdf; --idle:#2f7d4e; --warn:#b3261e; --need:#b8610a;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; --sans:-apple-system,"SF Pro Text",system-ui,sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0c1213; --panel:#111a1b; --ink:#dfeceb; --dim:#8da3a0; --line:#223031; --sel:#173a3e;
  --accent:#62c9d1; --work:#7ea6ff; --idle:#62c48c; --warn:#ff8f85; --need:#f3a653; } }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:13px/1.45 var(--sans); display:flex; flex-direction:column; overflow:hidden; user-select:none; }
.bar { padding:10px 16px 8px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:4px; background:var(--panel); }
.pline { display:flex; align-items:baseline; gap:12px; min-height:24px; }
.brand { font:600 11px var(--mono); letter-spacing:.14em; color:var(--accent); }
.crumb { font:600 15px var(--mono); } .crumb .sep { color:var(--dim); font-weight:400; margin:0 6px; }
.chord { font:15px var(--mono); letter-spacing:.06em; }
.chord .cur { display:inline-block; width:.6ch; height:1.1em; background:var(--accent); vertical-align:text-bottom; animation:blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .chord .cur { animation:none; } }
.chip { border:1px solid var(--accent); color:var(--accent); border-radius:99px; padding:0 9px; font:11px var(--mono); margin-left:auto; white-space:nowrap; }
.hint { color:var(--dim); font-size:12px; }
.hint b { color:var(--ink); font-weight:600; }
.hint.err { color:var(--warn); }
#inp { display:none; flex:1; min-width:0; font:14px var(--mono); background:transparent; border:0; outline:0; color:var(--ink); user-select:text; }
.bar.typing #inp { display:block; } .bar.typing .chord { display:none; }
#sugs { display:none; background:var(--panel); border-bottom:1px solid var(--line); padding:4px 0; }
.sg { display:flex; gap:12px; align-items:baseline; padding:4px 16px; cursor:default; }
.sg.on { background:var(--sel); }
.sg.dead { color:var(--dim); }
.sg .sl { font:600 13px var(--mono); color:var(--accent); min-width:9ch; }
.sg .ss { color:var(--dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sg .sc { color:var(--dim); font:11px var(--mono); }
.sh { padding:4px 16px 2px; color:var(--dim); font:11px var(--mono); }
#list { flex:1; overflow-y:auto; padding:6px 0 14px; }
.proj { display:flex; align-items:center; gap:10px; padding:9px 16px 4px; margin-top:6px; cursor:default; }
.proj .code { font:600 14px var(--mono); color:var(--accent); letter-spacing:.05em; }
.proj .pname { color:var(--dim); }
.proj .roll { margin-left:auto; display:flex; gap:10px; font:12px var(--mono); color:var(--dim); }
.proj.sel, .row.sel { background:var(--sel); }
.proj.head { margin-top:0; cursor:default; }
.grp { display:flex; gap:8px; align-items:center; padding:5px 16px 2px 40px; color:var(--dim); font:12px var(--mono); cursor:default; }
.grp b { color:var(--ink); font-weight:600; } .grp .ct { margin-left:auto; } .grp .caret { width:10px; }
.grp.sel { background:var(--sel); }
.row.ing { padding-left:62px; }
.sect { padding:2px 16px 2px 40px; color:var(--dim); font:11px var(--mono); letter-spacing:.06em; }
.row { display:flex; align-items:center; gap:10px; padding:3px 16px 3px 40px; cursor:default; min-height:26px; }
.key { width:18px; height:18px; flex:none; border:1px solid var(--line); border-radius:4px; display:grid; place-items:center; font:11px var(--mono); color:var(--dim); text-transform:lowercase; }
#list.inproj .key { color:var(--accent); border-color:var(--accent); }
#list.inproj .row:not(.hasKey) .key { opacity:.35; }
.dot { width:8px; height:8px; border-radius:50%; flex:none; }
.dot.working { background:var(--work); animation:pulse 1.4s ease-in-out infinite; }
.dot.idle { background:var(--idle); }
.dot.waiting { background:var(--need); box-shadow:0 0 0 3px color-mix(in srgb, var(--need) 28%, transparent); }
.row.waitingRow .nm { font-weight:600; }
.dot.shell { border:1.5px solid var(--dim); }
.dot.none { border:1.5px dashed var(--line); }
@keyframes pulse { 50% { opacity:.35; } }
@media (prefers-reduced-motion: reduce) { .dot.working { animation:none; } }
.nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row.shell .nm, .row.off .nm { color:var(--dim); }
.meta { color:var(--dim); font:11px var(--mono); flex:none; }
.empty { padding:3px 16px 3px 40px; color:var(--dim); font-size:12px; }
.foot { border-top:1px solid var(--line); padding:7px 16px; color:var(--dim); font:11px var(--mono); display:flex; gap:16px; flex-wrap:wrap; background:var(--panel); }
.foot b { color:var(--ink); font-weight:600; }
.ren { font:600 14px var(--mono); width:7ch; background:var(--panel); color:var(--ink); border:1px solid var(--accent); border-radius:4px; padding:0 4px; user-select:text; outline:0; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="pline">
    <span class="brand">DECK</span><span class="crumb" id="crumb"></span><span class="chord" id="chord"></span>
    <input id="inp" type="text" autocomplete="off" spellcheck="false" placeholder="search sessions">
    <span class="chip" id="chip"></span>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div id="sugs"></div>
<div id="list"></div>
<div class="foot"><span><b>code</b> enter project</span><span><b>key</b> jump</span><span><b>↑↓ ↵</b> move, go</span><span><b>/</b> search</span><span><b>space</b> next waiting</span><span><b>⌥G</b> move session</span><span><b>⌥R</b> rename code</span><span><b>esc</b> back</span><span style="margin-left:auto">build 12</span></div>

<script>
(function () {
  var model = { projects: [], unsorted: [] };
  var level = 'home', proj = null;   // where you are: every project, or inside one
  var mode = '';                     // '' keys | 'filter' search | 'assign' move prompt | 'rename'
  var buf = '', filter = '', sel = 0, flashTimer = null, flashing = false, renaming = null;
  var collapsed = {}, waitIdx = -1, alignNext = false, holdOffset = null, scrollTopNext = false, assignTarget = null;
  var sugItems = [], sugIdx = 0;
  var $ = function (id) { return document.getElementById(id); };
  function send(m) { try { window.webkit.messageHandlers.deck.postMessage(m); } catch (e) { console.log('->lua', JSON.stringify(m)); } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dlog(m) { send({ type: 'log', msg: String(Date.now() % 1000000) + ' ' + m }); }
  function logScroll(tag) {
    var L = $('list'), c = document.querySelector('.sel'), lr = L.getBoundingClientRect(), cr = c ? c.getBoundingClientRect() : null;
    dlog(tag + ' level=' + level + (proj ? ':' + proj : '') + ' mode=' + (mode || '-') + ' sel=' + sel + ' scrollTop=' + Math.round(L.scrollTop) + ' scrollH=' + L.scrollHeight + ' clientH=' + L.clientHeight +
      ' innerH=' + innerHeight + ' selTopInList=' + (cr ? Math.round(cr.top - lr.top) : 'n/a'));
  }
  // open() runs while WebKit still has the page hidden, and a scroll position set then is not drawn: the old picture
  // comes back. Once the page is visible, nudge the position by a pixel and back so the real position is drawn.
  function settleScroll() {
    var L = $('list');
    var apply = function () {
      var t = L.scrollTop, off = t === 0 ? 1 : t - 1;
      L.scrollTop = off;
      requestAnimationFrame(function () { L.scrollTop = t; dlog('settle applied scrollTop=' + Math.round(t)); });
    };
    if (document.visibilityState === 'visible') { requestAnimationFrame(apply); return; }
    var onVis = function () { if (document.visibilityState === 'visible') { document.removeEventListener('visibilitychange', onVis); requestAnimationFrame(apply); } };
    document.addEventListener('visibilitychange', onVis);
  }

  // ---------- what is in the list ----------
  function matches(item, p) {
    if (!filter) return true;
    var f = filter.toLowerCase(), ses = item.session || {};
    return item.name.toLowerCase().indexOf(f) !== -1 || p.code.indexOf(f) !== -1 || p.name.toLowerCase().indexOf(f) !== -1 ||
      (ses.path || '').toLowerCase().indexOf(f) !== -1 || (ses.state || '').indexOf(f) !== -1;
  }
  function rowsFor() {
    var rows = [], projects = model.projects;
    if (level === 'project') {
      projects = model.projects.filter(function (p) { return p.code === proj; });
      if (!projects.length) { level = 'home'; proj = null; projects = model.projects; }  // the project went away (renamed, removed)
    }
    if (level === 'project') rows.push({ t: 'head', p: projects[0] });
    projects.forEach(function (p) {
      var ms = p.managers.filter(function (m) { return matches(m, p); });
      var ws = p.work.filter(function (w) { return matches(w, p); });
      if (filter && !ms.length && !ws.length) return;
      if (level === 'home') rows.push({ t: 'proj', p: p });
      if (ms.length) rows.push({ t: 'sect', label: 'managers/' });
      ms.forEach(function (m) { rows.push({ t: 'item', p: p, item: m, mgr: true }); });
      var byGroup = {};
      ws.forEach(function (w) { var g = (w.session && w.session.group) || ''; (byGroup[g] = byGroup[g] || []).push(w); });
      var named = Object.keys(byGroup).filter(Boolean).sort();
      if (!named.length) {
        if (ws.length) rows.push({ t: 'sect', label: 'work/' });
        ws.forEach(function (w) { rows.push({ t: 'item', p: p, item: w }); });
      } else {
        named.concat(byGroup[''] ? [''] : []).forEach(function (g) {
          rows.push({ t: 'group', p: p, g: g, n: byGroup[g].length });
          if (filter || !collapsed[p.code + '/' + g]) byGroup[g].forEach(function (w) { rows.push({ t: 'item', p: p, item: w, grp: true }); });
        });
      }
    });
    if (level === 'home') {
      var un = model.unsorted.filter(function (u) { return !filter || u.name.toLowerCase().indexOf(filter.toLowerCase()) !== -1; });
      if (un.length) {
        rows.push({ t: 'proj', p: { code: '?', name: 'unsorted', managers: [], work: [], counts: { working: 0, idle: 0 } }, fake: true });
        un.forEach(function (u) { rows.push({ t: 'item', p: { code: '?' }, item: u }); });
      }
    }
    return rows;
  }
  function selectable(r) { return r.t !== 'sect' && r.t !== 'head'; }
  function flatSelectable() { return rowsFor().filter(selectable); }
  function keyOf(r) {
    if (r.t === 'proj') return 'p:' + r.p.code;
    if (r.t === 'group') return 'g:' + r.p.code + '/' + r.g;
    var ses = r.item.session;
    return 'i:' + r.p.code + ':' + (ses ? (ses.session_id || 'pane' + ses.pane_id) : 'slot:' + r.item.key + r.item.name);
  }
  function firstItemIdx() {
    var i = flatSelectable().findIndex(function (r) { return r.t === 'item'; });
    return i < 0 ? 0 : i;
  }
  // Where the highlight starts. After a search it is the best match: a project that matches comes before its sessions.
  function bestIdx() {
    var f = filter.toLowerCase();
    if (mode === 'filter' && f && level === 'home') {
      var rows = flatSelectable();
      var pi = rows.findIndex(function (r) { return r.t === 'proj' && r.p.code !== '?' && (r.p.code.indexOf(f) === 0 || r.p.name.toLowerCase().indexOf(f) === 0); });
      return pi >= 0 ? pi : firstItemIdx();
    }
    return level === 'project' ? firstItemIdx() : 0;
  }

  // ---------- drawing ----------
  function nextLine() {
    var r = flatSelectable()[sel];
    var who = !r ? '' : r.t === 'proj' ? (r.p.code === '?' ? '' : '<b>↵ enter ' + esc(r.p.code) + '</b> · ') : r.t === 'item' ? '<b>↵ jump to ' + esc(r.item.name) + '</b> · ' : '<b>↵ fold</b> · ';
    if (mode === 'assign') return 'moving a session · type a project or project/group · ↑↓ choose · <b>esc</b> cancel';
    if (mode === 'rename') return 'renaming the project code · <b>↵</b> save · <b>esc</b> cancel';
    if (mode === 'filter') return 'typing is on · ' + who + '↑↓ choose · <b>esc</b> ' + (level === 'project' ? 'clear filter' : 'cancel search');
    if (level === 'project') return 'letters are session keys · <b>/</b> filter · ↑↓ ↵ · <b>esc</b> back to all projects';
    if (buf) return 'typing a code: “' + esc(buf) + '” · keep typing, or <b>esc</b> to clear';
    return 'type a project code to enter it · <b>/</b> to search · <b>esc</b> closes the panel';
  }
  function renderBar() {
    $('crumb').innerHTML = level === 'project' ? '<span class="sep">›</span>' + esc(proj) : '';
    $('chord').innerHTML = esc(buf) + '<span class="cur"></span>';
    var chip = mode === 'filter' ? 'search' : mode === 'assign' ? 'move' : mode === 'rename' ? 'rename' : level === 'project' ? 'inside ' + proj : '';
    $('chip').textContent = chip; $('chip').style.display = chip ? '' : 'none';
    if (!flashing) { $('hint').className = 'hint'; $('hint').innerHTML = nextLine(); }
  }
  function flash(msg, err) {
    clearTimeout(flashTimer);
    if (!msg) { flashing = false; renderBar(); return; }
    flashing = true; $('hint').textContent = msg; $('hint').className = 'hint' + (err ? ' err' : '');
    flashTimer = setTimeout(function () { flashing = false; renderBar(); }, 2600);
  }
  function render() {
    var rows = rowsFor(), html = '';
    if (!rows.some(selectable)) html += '<div class="empty">Nothing matches. Press esc to clear the search.</div>';
    var si = -1;
    rows.forEach(function (r) {
      if (selectable(r)) si++;
      var s = selectable(r) && si === sel ? ' sel' : '';
      if (r.t === 'head' || r.t === 'proj') {
        var p = r.p, c = p.counts || {}, isHead = r.t === 'head';
        var attrs = isHead ? '' : ' data-i="' + si + '"';
        if (renaming === p.code) {
          html += '<div class="proj' + (isHead ? ' head' : '') + s + '"' + attrs + '><input class="ren" id="ren" value="' + esc(p.code) + '" maxlength="6"><span class="pname">' + esc(p.name) + '</span></div>';
        } else {
          html += '<div class="proj' + (isHead ? ' head' : '') + s + '"' + attrs + '><span class="code">' + esc(p.code) + '</span><span class="pname">' + esc(p.name) + '</span>' +
            '<span class="roll">' + (c.waiting ? '<span style="color:var(--need);font-weight:600">' + c.waiting + ' waiting</span>' : '') + (c.working ? '<span style="color:var(--work)">' + c.working + ' working</span>' : '') + (c.idle ? '<span>' + c.idle + ' idle</span>' : '') + '</span></div>';
        }
      } else if (r.t === 'group') {
        var shut = collapsed[r.p.code + '/' + r.g] && !filter;
        html += '<div class="grp' + s + '" data-i="' + si + '"><span class="caret">' + (shut ? '▸' : '▾') + '</span><b>' + esc(r.g || 'ungrouped') + '/</b><span class="ct">' + r.n + (r.n === 1 ? ' session' : ' sessions') + '</span></div>';
      } else if (r.t === 'sect') {
        html += '<div class="sect">' + r.label + '</div>';
      } else {
        var it = r.item, ses = it.session, st = ses ? (ses.kind === 'shell' ? 'shell' : ses.state) : 'none';
        html += '<div class="row' + (r.grp ? ' ing' : '') + (it.key ? ' hasKey' : '') + (st === 'shell' ? ' shell' : '') + (st === 'waiting' ? ' waitingRow' : '') + (!ses ? ' off' : '') + s + '" data-i="' + si + '">' +
          '<span class="key">' + esc(it.key || '') + '</span><span class="dot ' + st + '"></span>' +
          '<span class="nm">' + esc(it.name) + '</span><span class="meta">' + (ses ? (ses.pinned ? 'pinned · ' : '') + 'w' + ses.window_id : 'not running') + '</span></div>';
      }
    });
    $('list').innerHTML = html;
    $('list').className = level === 'project' ? 'inproj' : '';
    var cur = document.querySelector('.sel');
    if (cur) {
      var L = $('list'), rel = cur.getBoundingClientRect().top - L.getBoundingClientRect().top + L.scrollTop;
      var before = L.scrollTop, hadHold = holdOffset !== null, hadAlign = alignNext, hadTop = scrollTopNext;
      if (scrollTopNext) { L.scrollTop = 0; scrollTopNext = false; holdOffset = null; alignNext = false; }
      else if (holdOffset !== null) { L.scrollTop = Math.max(0, rel - holdOffset); holdOffset = null; alignNext = false; }
      else if (alignNext) { L.scrollTop = Math.max(0, rel - 6); alignNext = false; }
      else if (rel < L.scrollTop) L.scrollTop = Math.max(0, rel - 6);
      else if (rel + cur.offsetHeight > L.scrollTop + L.clientHeight) L.scrollTop = rel + cur.offsetHeight - L.clientHeight + 6;
      dlog('scroll rule: top=' + hadTop + ' hold=' + hadHold + ' align=' + hadAlign + ' rel=' + Math.round(rel) + ' scrollTop ' + Math.round(before) + '->' + Math.round(L.scrollTop) + ' selText=' + cur.textContent.trim().slice(0, 24));
    } else if (scrollTopNext) { $('list').scrollTop = 0; scrollTopNext = false; }
    if (renaming) { var el = $('ren'); if (el) { el.focus(); el.select(); } }
    renderBar();
    logScroll('render');
  }

  // ---------- moving between levels ----------
  function enterProject(code) {
    level = 'project'; proj = code; mode = ''; filter = ''; buf = '';
    $('inp').value = ''; $('bar').classList.remove('typing'); $('inp').blur();
    flashing = false; sel = firstItemIdx(); scrollTopNext = true;
    dlog('entered project ' + code);
    render();
    setTimeout(function () { send({ type: 'shot', tag: 'enter ' + code }); }, 300);
  }
  function leaveProject() {
    level = 'home'; proj = null; mode = ''; filter = ''; buf = '';
    $('inp').value = ''; $('bar').classList.remove('typing'); $('inp').blur();
    flashing = false; sel = 0; scrollTopNext = true;
    dlog('left project, back at home');
    render();
  }
  function cancelSearch() {
    mode = ''; filter = ''; $('inp').value = ''; $('bar').classList.remove('typing'); $('inp').blur();
    sel = bestIdx(); render();
  }
  function jump(item) {
    if (!item || !item.session) { flash('that session is not running', true); return; }
    send({ type: 'jump', pane_id: item.session.pane_id });
  }
  function toggleGroup(r) { var k = r.p.code + '/' + r.g; collapsed[k] = !collapsed[k]; render(); }
  // Enter, and a click, act on the highlighted row.
  function act(r) {
    if (!r) return;
    if (r.t === 'item') jump(r.item);
    else if (r.t === 'proj') { if (r.p.code === '?') flash('unsorted sessions have no code. Arrow to one and press ↵.', true); else enterProject(r.p.code); }
    else if (r.t === 'group') toggleGroup(r);
  }
  function move(d) { var n = flatSelectable().length; if (!n) return; sel = (sel + d + n) % n; render(); }

  // ---------- the move prompt (⌥G) and rename (⌥R) ----------
  function groupsOf(p) {
    var seen = {};
    p.managers.concat(p.work).forEach(function (it) { if (it.session && it.session.group) seen[it.session.group] = 1; });
    return Object.keys(seen).sort();
  }
  function countOf(p) { return p.managers.filter(function (m) { return m.session; }).length + p.work.length; }
  function buildSugs() {
    var v = $('inp').value.trim().toLowerCase(), slash = v.indexOf('/');
    var pq = slash === -1 ? v : v.slice(0, slash), gq = slash === -1 ? null : v.slice(slash + 1), items = [];
    if (!v) items.push({ label: 'back to folder placement', sub: 'unpin this session', spec: '-' });
    if (gq === null) {
      var ps = model.projects.filter(function (p) { return !pq || p.code.indexOf(pq) === 0 || p.name.toLowerCase().indexOf(pq) !== -1; });
      ps.sort(function (a, b) { return (b.code === pq) - (a.code === pq) || (b.code.indexOf(pq) === 0) - (a.code.indexOf(pq) === 0); });
      ps.forEach(function (p) { items.push({ label: p.code, sub: p.name, count: countOf(p), spec: p.code, fill: p.code + '/' }); });
    } else {
      var p = model.projects.filter(function (x) { return x.code === pq; })[0];
      if (!p) { items.push({ label: 'no project “' + pq + '”', sub: 'keep typing, or delete back to the code', spec: null }); }
      else {
        items.push({ label: p.code, sub: 'no group', count: countOf(p), spec: p.code });
        var gs = groupsOf(p).filter(function (g) { return !gq || g.indexOf(gq) !== -1; });
        gs.forEach(function (g) { items.push({ label: p.code + '/' + g, sub: 'existing group', spec: p.code + '/' + g }); });
        if (gq && groupsOf(p).indexOf(gq) === -1) items.push({ label: p.code + '/' + gq, sub: 'new group', spec: p.code + '/' + gq });
        if (gq) items.shift();
      }
    }
    return items;
  }
  function renderSugs() {
    sugItems = buildSugs();
    if (sugIdx >= sugItems.length) sugIdx = 0;
    var box = $('sugs');
    box.innerHTML = sugItems.map(function (it, i) {
      return '<div class="sg' + (i === sugIdx ? ' on' : '') + (it.spec ? '' : ' dead') + '" data-s="' + i + '"><span class="sl">' + esc(it.label) + '</span><span class="ss">' + esc(it.sub || '') + '</span><span class="sc">' + (it.count != null ? it.count + ' sessions' : '') + '</span></div>';
    }).join('') + '<div class="sh">↑↓ choose · tab complete · ↵ move · esc cancel</div>';
    box.style.display = 'block';
  }
  function endAssign() {
    mode = ''; assignTarget = null; $('bar').classList.remove('typing'); $('inp').blur(); $('inp').value = '';
    $('inp').placeholder = 'search sessions'; $('sugs').style.display = 'none'; renderBar();
  }
  function startRename() {
    if (mode !== '') return;
    var code = level === 'project' ? proj : (function () { var r = flatSelectable()[sel]; return r && r.p ? r.p.code : null; })();
    if (!code || code === '?') return;
    renaming = code; mode = 'rename'; render();
  }
  function startMove() {
    if (mode !== '') return;
    var gr = flatSelectable()[sel];
    if (!gr || gr.t !== 'item' || !gr.item.session || !gr.item.session.session_id) { flash('select a Claude session first (arrow keys), then press ⌥G', true); return; }
    assignTarget = gr.item.session.session_id; mode = 'assign'; buf = '';
    $('bar').classList.add('typing'); $('inp').placeholder = 'move “' + gr.item.name + '” to project or project/group';
    $('inp').value = ''; $('inp').focus(); sugIdx = 0; renderSugs(); renderBar();
  }

  // ---------- keys ----------
  function onKey(e) {
    var k = e.key;
    dlog('key ' + k + (e.altKey ? ' +alt' : '') + ' code=' + e.code + ' level=' + level + ' mode=' + (mode || '-'));
    if (mode === 'rename') {
      if (k === 'Enter') {
        var v = $('ren').value.trim().toLowerCase(), old = renaming; mode = ''; renaming = null;
        if (level === 'project' && proj === old && v) proj = v;   // keep following the project through its new code
        send({ type: 'rename', old: old, 'new': v }); render();
      } else if (k === 'Escape') { mode = ''; renaming = null; render(); }
      return;
    }
    if (mode === 'assign') {
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        if (sugItems.length) { sugIdx = (sugIdx + (k === 'ArrowDown' ? 1 : -1) + sugItems.length) % sugItems.length; renderSugs(); }
      } else if (k === 'Tab') {
        e.preventDefault();
        var t = sugItems[sugIdx];
        if (t && t.spec) { $('inp').value = t.fill || t.spec; sugIdx = 0; renderSugs(); }
      } else if (k === 'Enter') {
        e.preventDefault();
        var pick = sugItems[sugIdx];
        if (!pick || !pick.spec) { flash('pick a project from the list', true); return; }
        var sid = assignTarget; endAssign(); send({ type: 'assign', session_id: sid, spec: pick.spec }); render();
      } else if (k === 'Escape') { endAssign(); render(); }
      return;
    }
    if (mode === 'filter') {   // typing is on: letters are text
      if (k === 'Escape' || (k === 'Backspace' && $('inp').value === '')) { e.preventDefault(); cancelSearch(); }
      else if (k === 'Enter') { e.preventDefault(); act(flatSelectable()[sel]); }
      else if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); move(k === 'ArrowDown' ? 1 : -1); }
      return;
    }
    if (e.altKey && !e.ctrlKey && !e.metaKey && (e.code === 'KeyR' || k === '®')) { e.preventDefault(); startRename(); return; }
    if (e.altKey && !e.ctrlKey && !e.metaKey && (e.code === 'KeyG' || k === '©')) { e.preventDefault(); startMove(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (k === 'Escape' || (k === 'Backspace' && !buf)) {          // one level up
      if (buf) { buf = ''; renderBar(); }
      else if (level === 'project') leaveProject();
      else if (k === 'Escape') send({ type: 'hide' });
      return;
    }
    if (k === 'Backspace') { buf = buf.slice(0, -1); renderBar(); return; }
    if (k === 'Enter') {
      if (buf) { var ex = model.projects.filter(function (p) { return p.code === buf; })[0]; if (ex) enterProject(ex.code); else flash('no project “' + buf + '”', true); return; }
      act(flatSelectable()[sel]); return;
    }
    if (k === 'ArrowDown') { e.preventDefault(); move(1); return; }
    if (k === 'ArrowUp') { e.preventDefault(); move(-1); return; }
    if (k === '/') {                                              // the one door to search
      e.preventDefault(); mode = 'filter'; buf = ''; filter = ''; flashing = false;
      $('bar').classList.add('typing'); $('inp').value = ''; $('inp').focus(); sel = bestIdx(); render(); return;
    }
    if (k === ' ') {
      e.preventDefault();
      var w = [];
      model.projects.forEach(function (p) { p.managers.concat(p.work).forEach(function (it) { if (it.session && it.session.state === 'waiting') w.push(it); }); });
      if (!w.length) { flash('nothing is waiting on you'); return; }
      waitIdx = (waitIdx + 1) % w.length; jump(w[waitIdx]); return;
    }
    if (!/^[a-z0-9]$/i.test(k)) return;
    e.preventDefault(); k = k.toLowerCase();
    if (level === 'project') {                                    // inside: letters are session keys
      var p = model.projects.filter(function (x) { return x.code === proj; })[0];
      var hit = p ? p.managers.concat(p.work).filter(function (x) { return x.key === k; })[0] : null;
      if (hit) jump(hit); else flash('no session on “' + k + '” in ' + proj + '. You are still inside ' + proj + '.', true);
      return;
    }
    buf += k;                                                     // home: letters build a project code
    var cands = model.projects.filter(function (x) { return x.code.indexOf(buf) === 0; });
    if (!cands.length) { var bad = buf; buf = ''; flash('no project starts with “' + bad + '”. Press / to search.', true); return; }
    var exact = cands.filter(function (x) { return x.code === buf; })[0];
    if (exact && cands.length === 1) { enterProject(exact.code); return; }
    renderBar();
  }

  document.addEventListener('keydown', onKey);
  $('inp').addEventListener('input', function () {
    if (mode === 'assign') { sugIdx = 0; renderSugs(); return; }
    filter = this.value; sel = bestIdx(); render();
  });
  $('sugs').addEventListener('mousedown', function (e) {
    var r = e.target.closest('[data-s]'); if (!r) return; e.preventDefault();
    var it = sugItems[+r.getAttribute('data-s')]; if (!it || !it.spec) return;
    var sid = assignTarget; endAssign(); send({ type: 'assign', session_id: sid, spec: it.spec }); render();
  });
  $('list').addEventListener('click', function (e) {
    var el = e.target.closest('[data-i]'); if (!el) return;
    sel = +el.getAttribute('data-i'); act(flatSelectable()[sel]);
  });

  window.deck = {
    open: function () {
      dlog('open() called visibility=' + document.visibilityState); settleScroll();
      requestAnimationFrame(function () { dlog('animation frame ran after open, visibility=' + document.visibilityState); });
      setTimeout(function () { dlog('open+500ms scrollTop=' + Math.round($('list').scrollTop) + ' visibility=' + document.visibilityState); send({ type: 'shot', tag: 'open' }); }, 500);
      level = 'home'; proj = null; mode = ''; buf = ''; filter = ''; renaming = null; assignTarget = null; flashing = false; sel = 0;
      $('inp').value = ''; $('inp').placeholder = 'search sessions'; $('bar').classList.remove('typing'); $('sugs').style.display = 'none';
      scrollTopNext = true; render();
    },
    update: function (m) {
      dlog('update() projects=' + m.projects.length);
      var cur = flatSelectable()[sel], key = cur ? keyOf(cur) : null;
      var L = $('list'), el = document.querySelector('.sel');
      var off = el ? el.getBoundingClientRect().top - L.getBoundingClientRect().top : null;
      model = m;
      var rows = flatSelectable();
      if (key) { var i = rows.findIndex(function (x) { return keyOf(x) === key; }); if (i >= 0) sel = i; }
      if (sel >= rows.length) sel = Math.max(0, rows.length - 1);
      holdOffset = off;  // render() puts the selected row back at the same height on screen
      render();
    },
    flash: flash,
    startMove: startMove,
    startRename: startRename
  };
  render();
})();
</script>
</body>
</html>
